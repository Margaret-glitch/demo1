<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Onboarding & Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1c1513;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mobile Container Frame */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            background-color: #ecebe8;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* ----------------------------------------------------------------
           STAGE 1: SPLASH SCREEN (Initial Brown Preloader)
        ------------------------------------------------------------------- */
        .splash-screen {
            position: absolute;
            inset: 0;
            background-color: #4e352d;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 70px 0 50px;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clover-white {
            width: 80px;
            height: 80px;
            position: relative;
            animation: spinPause 3.2s ease-in-out infinite;
        }

        .clover-white .circle {
            width: 28px;
            height: 28px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
        }

        .clover-white .top { top: 4px; left: 50%; transform: translateX(-50%); }
        .clover-white .bottom { bottom: 4px; left: 50%; transform: translateX(-50%); }
        .clover-white .left { left: 4px; top: 50%; transform: translateY(-50%); }
        .clover-white .right { right: 4px; top: 50%; transform: translateY(-50%); }

        .loader-ring {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffffff;
            border-right-color: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            animation: continuousSpin 1.1s linear infinite;
        }

        /* ----------------------------------------------------------------
           GENERAL SCREEN STYLES
        ------------------------------------------------------------------- */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background-color: #ecebe8;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            z-index: 10;
        }

        .screen-slide-right {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .screen-slide-left {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }
        
        .screen-active {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        /* ----------------------------------------------------------------
           STAGE 2: ONBOARDING GRID SCREEN
        ------------------------------------------------------------------- */
        #screenOnboarding {
            justify-content: space-between;
            padding: 40px 20px 30px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .clover-brown {
            width: 64px;
            height: 64px;
            position: relative;
        }

        .clover-brown .circle {
            width: 22px;
            height: 22px;
            background-color: #281e1b;
            border-radius: 50%;
            position: absolute;
        }

        .clover-brown .top { top: 3px; left: 50%; transform: translateX(-50%); }
        .clover-brown .bottom { bottom: 3px; left: 50%; transform: translateX(-50%); }
        .clover-brown .left { left: 3px; top: 50%; transform: translateY(-50%); }
        .clover-brown .right { right: 3px; top: 50%; transform: translateY(-50%); }

        .subtitle {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            color: #4a4542;
            text-transform: uppercase;
        }

        .grid-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            padding: 10px 0;
            overflow: hidden;
        }

        .grid-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .pill {
            height: 68px;
            border-radius: 9999px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .pill-sm { width: 32px; }
        .pill-bg-dark { background-color: #281e1b; }
        .pill-bg-light { background-color: #deddd9; }
        .pill-photo-wide { width: 180px; }
        .pill-photo-medium { width: 140px; }
        .pill-photo-circle { width: 68px; }

        .btn-container {
            flex-shrink: 0;
            width: 100%;
            padding-top: 10px;
        }

        .btn-primary {
            width: 100%;
            height: 62px;
            background-color: #281e1b;
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(40, 30, 27, 0.25);
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .btn-primary:active { transform: scale(0.98); background-color: #181210; }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* ----------------------------------------------------------------
           STAGE 3: AUTH SELECTION SCREEN
        ------------------------------------------------------------------- */
        #screenAuth {
            background-color: #ffffff;
            padding: 50px 24px 35px;
            justify-content: space-between;
            align-items: center;
        }

        .auth-top-space { flex: 1; }

        .auth-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
        }

        .greeting {
            font-size: 22px;
            font-weight: 500;
            color: #1c1513;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .headline {
            font-size: 42px;
            font-weight: 800;
            color: #281e1b;
            line-height: 1.1;
            letter-spacing: -1px;
            max-width: 280px;
        }

        .auth-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .auth-btn {
            width: 100%;
            height: 60px;
            border-radius: 9999px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .auth-btn:active { transform: scale(0.98); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .auth-btn-email { background-color: #281e1b; color: #ffffff; }
        .auth-btn-social { background-color: #f1f0ec; color: #1c1513; }
        .auth-btn svg { width: 20px; height: 20px; }

        .terms-text {
            font-size: 13px;
            color: #5d5955;
            text-align: center;
            line-height: 1.5;
            padding: 0 10px;
        }

        .terms-text a { color: #281e1b; font-weight: 600; text-decoration: none; }

        /* ----------------------------------------------------------------
           STAGE 4: EMAIL FORM SCREEN
        ------------------------------------------------------------------- */
        #screenEmailForm {
            background-color: #ffffff;
            padding: 20px 24px 35px;
            justify-content: flex-start;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            height: 44px;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f1f0ec;
            color: #281e1b;
            transition: background-color 0.2s;
        }

        .back-btn:active { background-color: #deddd9; }

        .form-title {
            font-size: 32px;
            font-weight: 800;
            color: #281e1b;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #4a4542;
            padding-left: 4px;
        }

        .input-field {
            width: 100%;
            height: 56px;
            border-radius: 16px;
            border: 2px solid #f1f0ec;
            background-color: #faf9f7;
            padding: 0 16px;
            font-size: 16px;
            color: #1c1513;
            transition: border-color 0.2s, background-color 0.2s;
            outline: none;
        }

        .input-field:focus {
            border-color: #281e1b;
            background-color: #ffffff;
        }

        .form-footer {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .toggle-mode {
            text-align: center;
            font-size: 14px;
            color: #5d5955;
            margin-top: 10px;
        }

        .toggle-mode a {
            color: #281e1b;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            color: #d93025;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
            font-weight: 500;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .error-message.visible {
            opacity: 1;
        }

        /* ----------------------------------------------------------------
           STAGE 5: DASHBOARD SCREEN (Logged In)
        ------------------------------------------------------------------- */
        #screenDashboard {
            background-color: #ecebe8;
            padding: 50px 24px 35px;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #281e1b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 24px;
            box-shadow: 0 10px 20px rgba(40, 30, 27, 0.15);
        }

        .dashboard-name {
            font-size: 28px;
            font-weight: 800;
            color: #281e1b;
            margin-bottom: 8px;
            text-align: center;
        }

        .dashboard-email {
            font-size: 16px;
            color: #5d5955;
            margin-bottom: 40px;
            text-align: center;
        }

        .btn-logout {
            width: 100%;
            height: 56px;
            border-radius: 9999px;
            background-color: #f1f0ec;
            color: #d93025;
            border: 2px solid #deddd9;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.15s;
        }

        .btn-logout:active {
            transform: scale(0.98);
            background-color: #deddd9;
        }

        /* Loading Overlay for Github Processing */
        #screenProcessing {
            background-color: #4e352d;
            justify-content: center;
            align-items: center;
            z-index: 60;
        }
        
        .processing-text {
            color: #ffffff;
            margin-top: 24px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Keyframe Animations */
        @keyframes spinPause {
            0% { transform: rotate(0deg); }
            38% { transform: rotate(180deg); }
            50% { transform: rotate(180deg); }
            88% { transform: rotate(360deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes continuousSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- STAGE 1: PRELOADER SPLASH SCREEN -->
        <div class="splash-screen" id="splashScreen">
            <div class="splash-center">
                <div class="clover-white">
                    <div class="circle top"></div>
                    <div class="circle bottom"></div>
                    <div class="circle left"></div>
                    <div class="circle right"></div>
                </div>
            </div>
            <div class="loader-ring"></div>
        </div>

        <!-- STAGE 2: ONBOARDING GALLERY SCREEN -->
        <div class="screen screen-active" id="screenOnboarding">
            <div class="header">
                <div class="clover-brown">
                    <div class="circle top"></div>
                    <div class="circle bottom"></div>
                    <div class="circle left"></div>
                    <div class="circle right"></div>
                </div>
                <div class="subtitle">Your Story in Every Snap</div>
            </div>

            <div class="grid-container">
                <div class="grid-row" style="transform: translateX(-15px);">
                    <div class="pill pill-sm pill-bg-dark"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-photo-wide" style="background-image: url('https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=600&auto=format&fit=crop');"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                </div>
                <div class="grid-row" style="transform: translateX(-5px);">
                    <div class="pill pill-photo-medium" style="background-image: url('https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=600&auto=format&fit=crop');"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-dark"></div>
                </div>
                <div class="grid-row" style="transform: translateX(-20px);">
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-dark"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-photo-wide" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop');"></div>
                </div>
                <div class="grid-row" style="transform: translateX(-10px);">
                    <div class="pill pill-sm pill-bg-dark"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-photo-wide" style="background-image: url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=600&auto=format&fit=crop');"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                </div>
                <div class="grid-row" style="transform: translateX(-30px);">
                    <div class="pill pill-photo-medium" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop');"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-dark"></div>
                    <div class="pill pill-photo-circle" style="background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=600&auto=format&fit=crop');"></div>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn-primary" id="btnStart">Start</button>
            </div>
        </div>

        <!-- STAGE 3: AUTH / SIGN IN SELECTION -->
        <div class="screen screen-slide-right" id="screenAuth">
            <div class="auth-top-space"></div>

            <div class="auth-content">
                <div class="greeting">
                    Hey <span class="wave-emoji">👋🏻</span> there
                </div>
                <h1 class="headline">Let's get you sorted</h1>
            </div>

            <div class="auth-buttons">
                <!-- Email Auth -->
                <button class="auth-btn auth-btn-email" id="btnSelectEmail">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                    Continue with Email
                </button>

                <!-- GitHub Auth -->
                <button class="auth-btn auth-btn-social" id="btnSelectGithub">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                    </svg>
                    Continue with GitHub
                </button>
            </div>

            <div class="terms-text">
                By continuing you agreeing to <a href="#">Terms of Use</a><br>and <a href="#">Privacy Policy</a>
            </div>
        </div>

        <!-- STAGE 4: EMAIL FORM (Login/Register) -->
        <div class="screen screen-slide-right" id="screenEmailForm">
            <div class="nav-bar">
                <button class="back-btn" id="btnBackToAuth">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
            </div>

            <h2 class="form-title" id="emailFormTitle">Sign In</h2>

            <form id="emailAuthForm">
                <div class="input-group" id="nameGroup" style="display: none;">
                    <label for="inputName">Full Name</label>
                    <input type="text" id="inputName" class="input-field" placeholder="Alice Developer">
                </div>
                
                <div class="input-group">
                    <label for="inputEmail">Email Address</label>
                    <input type="email" id="inputEmail" class="input-field" placeholder="alice@example.com" required>
                </div>

                <div class="input-group">
                    <label for="inputPassword">Password</label>
                    <input type="password" id="inputPassword" class="input-field" placeholder="••••••••" required>
                </div>

                <div class="error-message" id="formError"></div>

                <div class="form-footer">
                    <button type="submit" class="btn-primary" id="btnSubmitEmail">Sign In</button>
                    
                    <div class="toggle-mode">
                        <span id="toggleText">Don't have an account?</span> 
                        <a id="btnToggleMode">Create one</a>
                    </div>
                </div>
            </form>
        </div>

        <!-- STAGE 5: DASHBOARD (Logged in state) -->
        <div class="screen screen-slide-right" id="screenDashboard">
            <div class="profile-avatar" id="dashAvatar">A</div>
            <h2 class="dashboard-name" id="dashName">Alice Developer</h2>
            <p class="dashboard-email" id="dashEmail">alice@example.com</p>
            
            <button class="btn-logout" id="btnLogout">Sign Out</button>
        </div>

        <!-- SPECIAL STAGE: GITHub Loading -->
        <div class="screen screen-slide-right" id="screenProcessing">
            <div class="loader-ring"></div>
            <p class="processing-text">Authenticating...</p>
        </div>

    </div>

    <script>
        // DOM Elements
        const splashScreen = document.getElementById('splashScreen');
        const screenOnboarding = document.getElementById('screenOnboarding');
        const screenAuth = document.getElementById('screenAuth');
        const screenEmailForm = document.getElementById('screenEmailForm');
        const screenDashboard = document.getElementById('screenDashboard');
        const screenProcessing = document.getElementById('screenProcessing');
        
        const btnStart = document.getElementById('btnStart');
        const btnSelectEmail = document.getElementById('btnSelectEmail');
        const btnSelectGithub = document.getElementById('btnSelectGithub');
        const btnBackToAuth = document.getElementById('btnBackToAuth');
        const btnToggleMode = document.getElementById('btnToggleMode');
        const btnSubmitEmail = document.getElementById('btnSubmitEmail');
        const btnLogout = document.getElementById('btnLogout');
        
        const emailAuthForm = document.getElementById('emailAuthForm');
        const emailFormTitle = document.getElementById('emailFormTitle');
        const nameGroup = document.getElementById('nameGroup');
        const toggleText = document.getElementById('toggleText');
        const formError = document.getElementById('formError');
        
        const inputName = document.getElementById('inputName');
        const inputEmail = document.getElementById('inputEmail');
        const inputPassword = document.getElementById('inputPassword');

        const dashName = document.getElementById('dashName');
        const dashEmail = document.getElementById('dashEmail');
        const dashAvatar = document.getElementById('dashAvatar');

        // State Variables
        let isRegisterMode = false;
        const BASE_AUTH = "https://storage.breacher.name.ng/U6op8Nr462Z46tBgxa2COUnja5z1/my-app/auth";
        let autoHideSplash;

        function initApp() {
            // Check for GitHub OAuth Callback ?code=XYZ
            const urlParams = new URLSearchParams(window.location.search);
            const githubCode = urlParams.get('code');

            if (githubCode) {
                // If returning from GitHub, bypass standard flow and process
                splashScreen.classList.add('hidden');
                switchScreen(screenOnboarding, screenProcessing, 'right');
                processGithubCallback(githubCode);
            } else {
                // Standard app startup flow
                autoHideSplash = setTimeout(() => {
                    splashScreen.classList.add('hidden');
                }, 3200);

                splashScreen.addEventListener('click', () => {
                    clearTimeout(autoHideSplash);
                    splashScreen.classList.add('hidden');
                });
            }
        }

        // Navigation Helper
        function switchScreen(hideScreen, showScreen, direction = 'left') {
            hideScreen.classList.remove('screen-active');
            if (direction === 'left') {
                hideScreen.classList.add('screen-slide-left');
                showScreen.classList.remove('screen-slide-right');
            } else {
                hideScreen.classList.add('screen-slide-right');
                showScreen.classList.remove('screen-slide-left');
            }
            showScreen.classList.add('screen-active');
        }

        function showError(msg) {
            formError.textContent = msg;
            formError.classList.add('visible');
            setTimeout(() => formError.classList.remove('visible'), 5000);
        }

        function setBtnLoading(btn, isLoading, originalText) {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<span style="opacity:0.7">Processing...</span>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Setup Dashboard with User Data
        function populateDashboard(user) {
            const name = user.name || user.email.split('@')[0];
            dashName.textContent = name;
            dashEmail.textContent = user.email || 'No email provided';
            dashAvatar.textContent = name.charAt(0).toUpperCase();
        }


        // 1. GitHub Auth URL Redirect
        btnSelectGithub.addEventListener('click', async () => {
            const originalContent = btnSelectGithub.innerHTML;
            try {
                setBtnLoading(btnSelectGithub, true, originalContent);
                const resUrl = await fetch(`${BASE_AUTH}/github/url`);
                if (!resUrl.ok) throw new Error("Failed to fetch auth URL");
                
                const { url } = await resUrl.json();
                window.location.href = url; // Redirects user
            } catch (err) {
                console.error(err);
                setBtnLoading(btnSelectGithub, false, originalContent);
                // Temporarily swap text for error
                btnSelectGithub.innerHTML = `<span style="color:#d93025">Connection Error</span>`;
                setTimeout(() => btnSelectGithub.innerHTML = originalContent, 3000);
            }
        });

        // 2. Process GitHub Callback
        async function processGithubCallback(code) {
            try {
                // Clear URL parameters for clean UI (HTML5 History API)
                window.history.replaceState({}, document.title, window.location.pathname);

                const loginRes = await fetch(`${BASE_AUTH}/github/callback`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code })
                });

                if (!loginRes.ok) throw new Error("GitHub Authentication Failed");

                const { user, isNew } = await loginRes.json();
                console.log(isNew ? "Signed up via GitHub!" : "Logged in via GitHub!", user);
                
                populateDashboard(user);
                switchScreen(screenProcessing, screenDashboard, 'left');
            } catch (err) {
                console.error(err);
                // If fail, push them back to Auth selection
                switchScreen(screenProcessing, screenAuth, 'right');
            }
        }

        // 3. Email Authentication (Register / Login)
        emailAuthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const originalContent = btnSubmitEmail.innerHTML;
            setBtnLoading(btnSubmitEmail, true, originalContent);
            formError.classList.remove('visible');

            const payload = {
                email: inputEmail.value.trim(),
                password: inputPassword.value
            };
            
            if (isRegisterMode) {
                payload.name = inputName.value.trim();
            }

            try {
                const endpoint = isRegisterMode ? '/register' : '/login';
                
                const res = await fetch(`${BASE_AUTH}${endpoint}`, {
                    method: "POST",
                    credentials: "include", // CRITICAL for receiving session cookie
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || errData.message || `Authentication failed.`);
                }

                const data = await res.json();
                console.log(isRegisterMode ? "Registered user:" : "Logged in user:", data.user);
                
                populateDashboard(data.user);
                switchScreen(screenEmailForm, screenDashboard, 'left');
            } catch (err) {
                console.error(err);
                showError(err.message);
            } finally {
                setBtnLoading(btnSubmitEmail, false, originalContent);
            }
        });

        // 4. Logout
        btnLogout.addEventListener('click', async () => {
            const originalContent = btnLogout.innerHTML;
            try {
                setBtnLoading(btnLogout, true, originalContent);
                await fetch(`${BASE_AUTH}/logout`, {
                    method: "POST",
                    credentials: "include"
                });
                console.log("Logged out successfully");
                
                // Clear inputs
                inputPassword.value = '';
                
                // Go back to auth screen
                switchScreen(screenDashboard, screenAuth, 'right');
            } catch (err) {
                console.error(err);
            } finally {
                setBtnLoading(btnLogout, false, originalContent);
            }
        });

        
        // Go from Onboarding -> Auth Methods
        btnStart.addEventListener('click', () => {
            switchScreen(screenOnboarding, screenAuth, 'left');
        });

        // Go from Auth Methods -> Email Form
        btnSelectEmail.addEventListener('click', () => {
            switchScreen(screenAuth, screenEmailForm, 'left');
        });

        // Go back from Email Form -> Auth Methods
        btnBackToAuth.addEventListener('click', () => {
            switchScreen(screenEmailForm, screenAuth, 'right');
            formError.classList.remove('visible');
        });

        // Toggle between Login and Registration in Email Form
        btnToggleMode.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            formError.classList.remove('visible');
            
            if (isRegisterMode) {
                emailFormTitle.textContent = "Create Account";
                nameGroup.style.display = "flex";
                inputName.required = true;
                btnSubmitEmail.textContent = "Sign Up";
                toggleText.textContent = "Already have an account?";
                btnToggleMode.textContent = "Sign In";
            } else {
                emailFormTitle.textContent = "Sign In";
                nameGroup.style.display = "none";
                inputName.required = false;
                btnSubmitEmail.textContent = "Sign In";
                toggleText.textContent = "Don't have an account?";
                btnToggleMode.textContent = "Create one";
            }
        });

        // Boot App
        initApp();
    </script>
</body>
</html>
