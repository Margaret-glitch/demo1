<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Onboarding Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1c1513;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mobile Container Frame */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            background-color: #ecebe8;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* ----------------------------------------------------------------
           STAGE 1: SPLASH SCREEN (Initial Brown Preloader)
        ------------------------------------------------------------------- */
        .splash-screen {
            position: absolute;
            inset: 0;
            background-color: #4e352d;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 70px 0 50px;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* White Clover Icon for Preloader (Separated circles, no spring physics) */
        .clover-white {
            width: 80px;
            height: 80px;
            position: relative;
            animation: spinPause 3.2s ease-in-out infinite;
        }

        .clover-white .circle {
            width: 28px;
            height: 28px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
        }

        .clover-white .top {
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .clover-white .bottom {
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .clover-white .left {
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
        }

        .clover-white .right {
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
        }

        .loader-ring {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffffff;
            border-right-color: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            animation: continuousSpin 1.1s linear infinite;
        }

        /* ----------------------------------------------------------------
           STAGE 2: ONBOARDING GRID SCREEN
        ------------------------------------------------------------------- */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px 30px;
            background-color: #ecebe8;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }

        #screenOnboarding.slide-out {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .clover-brown {
            width: 64px;
            height: 64px;
            position: relative;
        }

        .clover-brown .circle {
            width: 22px;
            height: 22px;
            background-color: #281e1b;
            border-radius: 50%;
            position: absolute;
        }

        .clover-brown .top { top: 3px; left: 50%; transform: translateX(-50%); }
        .clover-brown .bottom { bottom: 3px; left: 50%; transform: translateX(-50%); }
        .clover-brown .left { left: 3px; top: 50%; transform: translateY(-50%); }
        .clover-brown .right { right: 3px; top: 50%; transform: translateY(-50%); }

        .subtitle {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            color: #4a4542;
            text-transform: uppercase;
        }

        /* Flexible Grid Section - adjusts smoothly across different screen heights */
        .grid-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            padding: 10px 0;
            overflow: hidden;
        }

        .grid-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .pill {
            height: 68px;
            border-radius: 9999px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .pill-sm { width: 32px; }
        .pill-bg-dark { background-color: #281e1b; }
        .pill-bg-light { background-color: #deddd9; }
        .pill-photo-wide { width: 180px; }
        .pill-photo-medium { width: 140px; }
        .pill-photo-circle { width: 68px; }

        /* Fixed, non-squished Start Button */
        .btn-container {
            flex-shrink: 0;
            width: 100%;
            padding-top: 10px;
        }

        .btn-primary {
            width: 100%;
            height: 62px; /* Fixed generous height */
            background-color: #281e1b;
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(40, 30, 27, 0.25);
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
            background-color: #181210;
        }

        /* ----------------------------------------------------------------
           STAGE 3: LOGIN / AUTH SELECTION SCREEN
        ------------------------------------------------------------------- */
        #screenAuth {
            background-color: #ffffff;
            transform: translateX(100%);
            opacity: 0;
            z-index: 20;
            padding: 50px 24px 35px;
            justify-content: space-between;
            align-items: center;
        }

        #screenAuth.active {
            transform: translateX(0);
            opacity: 1;
        }

        .auth-top-space {
            flex: 1;
        }

        .auth-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
        }

        .greeting {
            font-size: 22px;
            font-weight: 500;
            color: #1c1513;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .wave-emoji {
            display: inline-block;
            font-size: 22px;
        }

        .headline {
            font-size: 42px;
            font-weight: 800;
            color: #281e1b; /* Using preloader brown color */
            line-height: 1.1;
            letter-spacing: -1px;
            max-width: 280px;
        }

        .auth-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .auth-btn {
            width: 100%;
            height: 60px;
            border-radius: 9999px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .auth-btn:active {
            transform: scale(0.98);
        }

        /* Main email button styled with exact preloader dark brown color */
        .auth-btn-email {
            background-color: #281e1b;
            color: #ffffff;
        }

        /* Secondary social login buttons */
        .auth-btn-social {
            background-color: #f1f0ec;
            color: #1c1513;
        }

        .auth-btn svg {
            width: 20px;
            height: 20px;
        }

        .terms-text {
            font-size: 13px;
            color: #5d5955;
            text-align: center;
            line-height: 1.5;
            padding: 0 10px;
        }

        .terms-text a {
            color: #281e1b;
            font-weight: 600;
            text-decoration: none;
        }

        /* Keyframe Animations */
        @keyframes spinPause {
            0% { transform: rotate(0deg); }
            38% { transform: rotate(180deg); }
            50% { transform: rotate(180deg); }
            88% { transform: rotate(360deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes continuousSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
  <link rel="stylesheet" href="./pwa.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

    <div class="app-container">
        
        <!-- STAGE 1: PRELOADER SPLASH SCREEN -->
        <div class="splash-screen" id="splashScreen">
            <div class="splash-center">
                <div class="clover-white">
                    <div class="circle top"></div>
                    <div class="circle bottom"></div>
                    <div class="circle left"></div>
                    <div class="circle right"></div>
                </div>
            </div>
            <div class="loader-ring"></div>
        </div>

        <!-- STAGE 2: ONBOARDING GALLERY SCREEN -->
        <div class="screen" id="screenOnboarding">
            <!-- Header -->
            <div class="header">
                <div class="clover-brown">
                    <div class="circle top"></div>
                    <div class="circle bottom"></div>
                    <div class="circle left"></div>
                    <div class="circle right"></div>
                </div>
                <div class="subtitle">Your Story in Every Snap</div>
            </div>

            <!-- Staggered Image Pill Grid -->
            <div class="grid-container">
                <div class="grid-row" style="transform: translateX(-15px);">
                    <div class="pill pill-sm pill-bg-dark"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-photo-wide" style="background-image: url('https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=600&auto=format&fit=crop');"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                </div>

                <div class="grid-row" style="transform: translateX(-5px);">
                    <div class="pill pill-photo-medium" style="background-image: url('https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=600&auto=format&fit=crop');"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-dark"></div>
                </div>

                <div class="grid-row" style="transform: translateX(-20px);">
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-dark"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-photo-wide" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop');"></div>
                </div>

                <div class="grid-row" style="transform: translateX(-10px);">
                    <div class="pill pill-sm pill-bg-dark"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-photo-wide" style="background-image: url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=600&auto=format&fit=crop');"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                </div>

                <div class="grid-row" style="transform: translateX(-30px);">
                    <div class="pill pill-photo-medium" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop');"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-light"></div>
                    <div class="pill pill-sm pill-bg-dark"></div>
                    <div class="pill pill-photo-circle" style="background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=600&auto=format&fit=crop');"></div>
                </div>
            </div>

            <!-- Start Button (Maintains fixed size) -->
            <div class="btn-container">
                <button class="btn-primary" id="startBtn">Start</button>
            </div>
        </div>

        <!-- STAGE 3: AUTH / SIGN IN SCREEN -->
        <div class="screen" id="screenAuth">
            <div class="auth-top-space"></div>

            <div class="auth-content">
                <div class="greeting">
                    Hey <span class="wave-emoji">👋🏻</span> there
                </div>
                <h1 class="headline">Let's get you sorted</h1>
            </div>

            <div class="auth-buttons">
                <!-- Email button in brown -->
                <button class="auth-btn auth-btn-email">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                    Continue with Email
                </button>

                <!-- Google login button -->
                <button class="auth-btn auth-btn-social">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Continue with Google
                </button>

                <!-- Apple login button -->
                <button class="auth-btn auth-btn-social">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 .6-2.63 1.34-.56.65-1.05 1.72-.92 2.74 1.01.08 2.04-.49 2.62-1.23z"/>
                    </svg>
                    Continue with Apple
                </button>
            </div>

            <div class="terms-text">
                By continuing you agreeing to <a href="#">Terms of Use</a><br>and <a href="#">Privacy Policy</a>
            </div>
        </div>

    </div>

    <script>
        const splashScreen = document.getElementById('splashScreen');
        const screenOnboarding = document.getElementById('screenOnboarding');
        const screenAuth = document.getElementById('screenAuth');
        const startBtn = document.getElementById('startBtn');

        // Automatically hide preloader splash screen after 3.2s
        const autoHideSplash = setTimeout(() => {
            splashScreen.classList.add('hidden');
        }, 3200);

        // Allow user to tap splash screen to skip directly
        splashScreen.addEventListener('click', () => {
            clearTimeout(autoHideSplash);
            splashScreen.classList.add('hidden');
        });

        // Clicking "Start" slides to "Let's get you sorted" Auth Screen
        startBtn.addEventListener('click', () => {
            screenOnboarding.classList.add('slide-out');
            screenAuth.classList.add('active');
        });
    </script>
  <script src="./pwa.js"></script>
</body>
</html>
